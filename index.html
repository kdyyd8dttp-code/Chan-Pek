<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chan Pek | Registrar mascota</title>
<style>
body{font-family:Arial,sans-serif;background:#f4efe7;margin:0;color:#2d2a26}
.wrap{max-width:560px;margin:30px auto;padding:20px}
.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 5px 20px #0001}
h1{margin-top:0} label{display:block;margin:14px 0 6px;font-weight:bold}
input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:9px}
button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#2d2a26;color:white;font-weight:bold}
.note{font-size:13px;color:#666}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>🐾 CHAN PEK</h1>
<p><b>Amor que se lleva en cada patita</b></p>
<h2>Registra a tu mascota</h2>
<p class="note">Este es el QR que irá en el empaque.</p>
<form id="form">
<label>Nombre del dueño</label><input id="owner" required>
<label>Teléfono</label><input id="phone" required>
<label>Dirección</label><input id="address" required>
<label>Nombre de la mascota</label><input id="pet" required>
<label>Raza</label><input id="breed">
<label>Edad</label><input id="age">
<label>Foto (URL, opcional)</label><input id="photo" type="url">
<label>Información importante</label><textarea id="important" placeholder="Ej. No puede comer pollo"></textarea>
<label>Dato adicional</label><textarea id="extra" placeholder="Ej. Es tímida con personas desconocidas"></textarea>
<button>Registrar mascota</button>
</form>
<div id="result"></div>
</div></div>
<script>
const form=document.querySelector('#form');
form.addEventListener('submit',e=>{
 e.preventDefault();
 const data={
  owner:owner.value,phone:phone.value,address:address.value,pet:pet.value,
  breed:breed.value,age:age.value,photo:photo.value,
  important:important.value,extra:extra.value
 };
 localStorage.setItem('chanpek_demo',JSON.stringify(data));
 document.querySelector('#result').innerHTML='<p><b>Registro creado como CHANPEK-0001.</b></p><p>Para el prototipo, usa el QR de la plaquita incluido con los archivos.</p>';
});
</script>
</body></html>
